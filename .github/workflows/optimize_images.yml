name: Оптимизация изображений

on:
  push:
    paths:
      - 'heroes.csv'
      - 'item_images.csv'
      - 'Talent_description.csv'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  optimize:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick webp

      - name: Create cache directory
        run: |
          mkdir -p images_cache
          echo "📁 Папка images_cache создана"

      - name: Check CSV files exist
        run: |
          echo "📁 Проверяем наличие CSV файлов:"
          ls -la *.csv || echo "❌ Нет CSV файлов!"
          echo ""
          echo "📁 Проверяем heroes.csv:"
          head -2 heroes.csv || echo "❌ heroes.csv не найден!"
          echo ""
          echo "📁 Проверяем item_images.csv:"
          head -2 item_images.csv || echo "❌ item_images.csv не найден!"
          echo ""
          echo "📁 Проверяем Talent_description.csv:"
          head -2 "Talent_description.csv" || echo "❌ Talent_description.csv не найден!"

      - name: Check script exists
        run: |
          echo "📁 Проверяем скрипт:"
          ls -la scripts/download_images.py || echo "❌ Скрипт не найден!"

      - name: Download and optimize images
        run: |
          echo "🚀 Запускаем скрипт..."
          python scripts/download_images.py
          echo "📁 Проверяем результат:"
          ls -la images_cache/ || echo "❌ Папка images_cache пуста или не создана!"

      - name: Check for changes
        id: check_changes
        run: |
          git add -f images_cache/
          if git diff --staged --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Ensure cache directory exists
        if: steps.check_changes.outputs.changes == 'false'
        run: |
          mkdir -p images_cache
          touch images_cache/.gitkeep
          git add images_cache/.gitkeep

      - name: Commit optimized images
        run: |
          git config user.name "GitHub Actions Bot"
          git config.user.email "actions@github.com"
          git add images_cache/
          if git diff --staged --quiet; then
            echo "📭 Нет изменений для коммита"
          else
            git commit -m "🖼️ Автооптимизация изображений" || echo "Нет изменений"
            git push || echo "Нет изменений для пуша"
          fi
