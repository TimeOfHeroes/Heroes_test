name: Оптимизация изображений

on:
  # Запуск при изменении CSV файлов
  push:
    paths:
      - 'heroes.csv'
      - 'export - Герои - View.csv'
      - 'item_images.csv'
  
  # Запуск раз в сутки (в 3:00 ночи)
  schedule:
    - cron: '0 3 * * *'
  
  # Возможность запуска вручную из интерфейса
  workflow_dispatch:

jobs:
  optimize:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Копируем код из репозитория
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Устанавливаем Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. Устанавливаем библиотеки для работы с картинками
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      # 4. Устанавливаем программу для конвертации в WebP
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick webp

      # 5. Создаём папку для оптимизированных картинок
      - name: Create cache directory
        run: |
          mkdir -p images_cache

      # 6. Запускаем скрипт оптимизации
      - name: Download and optimize images
        run: |
          python scripts/download_images.py

      # 7. Проверяем, были ли изменения
      - name: Check for changes
        id: check_changes
        run: |
          git add images_cache/
          if git diff --staged --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      # 8. Сохраняем изменения в репозиторий
      - name: Commit optimized images
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git commit -m "🖼️ Автооптимизация изображений"
          git push
