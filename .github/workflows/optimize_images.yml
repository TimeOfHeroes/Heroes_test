name: Оптимизация изображений

on:
  push:
    paths:
      - 'heroes.csv'
      - 'export - Герои - View.csv'
      - 'item_images.csv'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  optimize:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick webp

      - name: Create cache directory
        run: |
          mkdir -p images_cache
- name: Check files structure
  run: |
    echo "📁 Текущая структура папок:"
    ls -la
    echo ""
    echo "📁 Проверяем папку scripts:"
    ls -la scripts/ || echo "Папка scripts не найдена!"
    echo ""
    echo "📁 Проверяем все папки с именем scripts:"
    find . -name "scripts" -type d
    echo ""
    echo "📁 Ищем файл download_images.py:"
    find . -name "download_images.py"
      - name: Download and optimize images
        run: |
          python scripts/download_images.py

      - name: Check for changes
        id: check_changes
        run: |
          git add -f images_cache/
          if git diff --staged --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Ensure cache directory exists
        if: steps.check_changes.outputs.changes == 'false'
        run: |
          mkdir -p images_cache
          touch images_cache/.gitkeep
          git add images_cache/.gitkeep

      - name: Commit optimized images
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add images_cache/
          if git diff --staged --quiet; then
            echo "📭 Нет изменений для коммита"
          else
            git commit -m "🖼️ Автооптимизация изображений" || echo "Нет изменений"
            git push || echo "Нет изменений для пуша"
          fi
